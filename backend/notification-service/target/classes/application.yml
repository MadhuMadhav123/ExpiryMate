server:
    port: 8083

spring:
    application:
        name: notification-service

    datasource:
        url: ${DB_URL:jdbc:mysql://localhost:3306/notification_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
        username: ${DB_USER:root}
        password: ${DB_PASSWORD:root@9966}

    jpa:
        hibernate:
            ddl-auto: update
        open-in-view: false

    mail:
        host: ${MAIL_HOST:localhost}
        port: ${MAIL_PORT:1025}
        username: ${MAIL_USERNAME:}
        password: ${MAIL_PASSWORD:}
        properties:
            mail:
                smtp:
                    auth: ${MAIL_SMTP_AUTH:false}
                    starttls:
                        enable: ${MAIL_STARTTLS:false}
                    connectiontimeout: 5000
                    timeout: 5000
                    writetimeout: 5000

springdoc:
    swagger-ui:
        enabled: false
    api-docs:
        enabled: true

document-service:
    url: ${DOCUMENT_SERVICE_URL:http://DOCUMENT-SERVICE}

app:
    mail:
        from: ${MAIL_FROM:reminders@expirymate.local}
    reminders:
        scan-delay-ms: ${REMINDER_SCAN_DELAY_MS:60000}

eureka:
    client:
        service-url:
            defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    instance:
        prefer-ip-address: true
