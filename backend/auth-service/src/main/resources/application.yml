server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/auth_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root@9966}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: true

jwt:
  secret: ${JWT_SECRET:expirymate-demo-secret-key-must-be-at-least-32-bytes}

notification-service:
  url: ${NOTIFICATION_SERVICE_URL:http://NOTIFICATION-SERVICE}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP:false}
    hostname: ${EUREKA_HOSTNAME:localhost}

logging:
  file:
    name: ${LOG_FILE:logs/auth-service.log}

  level:
    root: INFO
    com.expirymate.auth: INFO