name: Backend Deploy

on:
  push:
    branches:
      - aws_deploy
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd /home/ec2-user/ExpiryMate

            git fetch origin aws_deploy
            git reset --hard origin/aws_deploy
            git clean -fd

            cd backend

            docker compose \
              --env-file .env.aws \
              -f docker-compose.aws.yml \
              up -d --build

            docker compose \
              --env-file .env.aws \
              -f docker-compose.aws.yml \
              ps
