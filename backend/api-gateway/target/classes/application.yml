server:
    port: 8080

spring:
    application:
        name: api-gateway

    cloud:
        gateway:
            globalcors:
                corsConfigurations:
                    "[/**]":
                        allowedOrigins: "*"
                        allowedMethods: "*"
                        allowedHeaders: "*"

            routes:
                - id: auth-service
                  uri: lb://AUTH-SERVICE
                  predicates:
                      - Path=/api/auth/**,/api/profile/**

                - id: document-service
                  uri: lb://DOCUMENT-SERVICE
                  predicates:
                      - Path=/api/documents/**

                - id: notification-service
                  uri: lb://NOTIFICATION-SERVICE
                  predicates:
                      - Path=/api/notifications/**

                - id: auth-service-docs
                  uri: lb://AUTH-SERVICE
                  predicates:
                      - Path=/auth-service/v3/api-docs/**
                  filters:
                      - RewritePath=/auth-service/(?<segment>.*), /$\{segment}

                - id: document-service-docs
                  uri: lb://DOCUMENT-SERVICE
                  predicates:
                      - Path=/document-service/v3/api-docs/**
                  filters:
                      - RewritePath=/document-service/(?<segment>.*), /$\{segment}

                - id: notification-service-docs
                  uri: lb://NOTIFICATION-SERVICE
                  predicates:
                      - Path=/notification-service/v3/api-docs/**
                  filters:
                      - RewritePath=/notification-service/(?<segment>.*), /$\{segment}

springdoc:
    api-docs:
        enabled: true
    swagger-ui:
        path: /swagger-ui.html
        urls:
            - name: Authentication Service
              url: /auth-service/v3/api-docs
            - name: Document Service
              url: /document-service/v3/api-docs
            - name: Notification Service
              url: /notification-service/v3/api-docs
        urls-primary-name: Authentication Service

eureka:
    client:
        service-url:
            defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    instance:
        prefer-ip-address: true

management:
    endpoints:
        web:
            exposure:
                include: health,info
