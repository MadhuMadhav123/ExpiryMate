services:

  mailpit:
    image: axllent/mailpit:latest
    container_name: expirymate-mailpit
    ports:
      - "8025:8025"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: expirymate-rabbitmq
    ports:
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    restart: unless-stopped

  eureka-server:
    build:
      context: ./eureka-server
    container_name: expirymate-eureka

    environment:
      LOG_FILE: /app/logs/eureka-server.log

    volumes:
      - ./logs/eureka:/app/logs

    ports:
      - "8761:8761"

    restart: unless-stopped

  notification-service:
    build:
      context: ./notification-service
    container_name: expirymate-notification

    environment:
      DB_URL: jdbc:mysql://${RDS_ENDPOINT}:3306/notification_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      DOCUMENT_SERVICE_URL: http://DOCUMENT-SERVICE

      EUREKA_URL: http://eureka-server:8761/eureka/
      EUREKA_HOSTNAME: notification-service
      EUREKA_PREFER_IP: "false"

      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-reminders@expirymate.local}

      REMINDER_SCAN_DELAY_MS: ${REMINDER_SCAN_DELAY_MS:-60000}

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

      LOG_FILE: /app/logs/notification-service.log

    volumes:
      - ./logs/notification:/app/logs

    depends_on:
      eureka-server:
        condition: service_started
      rabbitmq:
        condition: service_started
      mailpit:
        condition: service_started

    restart: unless-stopped

  auth-service:
    build:
      context: ./auth-service
    container_name: expirymate-auth

    environment:
      DB_URL: jdbc:mysql://${RDS_ENDPOINT}:3306/auth_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

      EUREKA_URL: http://eureka-server:8761/eureka/
      EUREKA_HOSTNAME: auth-service
      EUREKA_PREFER_IP: "false"

      NOTIFICATION_SERVICE_URL: http://NOTIFICATION-SERVICE

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

      LOG_FILE: /app/logs/auth-service.log

    volumes:
      - ./logs/auth:/app/logs

    depends_on:
      eureka-server:
        condition: service_started
      rabbitmq:
        condition: service_started
      notification-service:
        condition: service_started

    restart: unless-stopped

  document-service:
    build:
      context: ./document-service
    container_name: expirymate-document

    environment:
      DB_URL: jdbc:mysql://${RDS_ENDPOINT}:3306/document_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

      EUREKA_URL: http://eureka-server:8761/eureka/
      EUREKA_HOSTNAME: document-service
      EUREKA_PREFER_IP: "false"

      NOTIFICATION_SERVICE_URL: http://NOTIFICATION-SERVICE

      DOCUMENT_STORAGE_PATH: /data/documents

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

      LOG_FILE: /app/logs/document-service.log

    volumes:
      - document_files:/data/documents
      - ./logs/document:/app/logs

    depends_on:
      eureka-server:
        condition: service_started
      rabbitmq:
        condition: service_started
      notification-service:
        condition: service_started

    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
    container_name: expirymate-gateway

    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      LOG_FILE: /app/logs/api-gateway.log

    volumes:
      - ./logs/gateway:/app/logs

    depends_on:
      eureka-server:
        condition: service_started
      auth-service:
        condition: service_started
      document-service:
        condition: service_started
      notification-service:
        condition: service_started

    ports:
      - "8080:8080"

    restart: unless-stopped

volumes:
  document_files: